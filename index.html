<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Solar Leads Tracker</title>

  <!-- TailwindCSS for prototyping -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.6.11/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.11/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.11/firebase-firestore-compat.js"></script>

  <!-- Chart.js & Leaflet -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
</head>
<body class="bg-gray-100 font-sans">

  <!-- Login Screen -->
  <div id="login-screen" class="flex justify-center items-center h-screen">
    <div class="bg-white p-8 rounded shadow-md w-80">
      <h2 class="text-2xl mb-4 font-bold text-center">Login</h2>
      <input id="email" type="email" placeholder="Email" class="w-full mb-2 p-2 border rounded" />
      <input id="password" type="password" placeholder="Password" class="w-full mb-4 p-2 border rounded" />
      <button id="login-btn" class="bg-blue-500 text-white px-4 py-2 rounded w-full">Login</button>
      <p class="text-sm mt-2 text-center">
        No account? <a href="#" id="register-link" class="text-blue-600 underline">Register</a>
      </p>
    </div>
  </div>

  <!-- Dashboard -->
  <div id="dashboard" class="hidden p-4">
    <div class="flex justify-between items-center mb-4">
      <h1 class="text-3xl font-bold">Dashboard</h1>
      <button id="logout-btn" class="bg-red-500 text-white px-4 py-2 rounded">Logout</button>
    </div>

    <!-- Summary Cards -->
    <div id="summary-cards" class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6"></div>

    <!-- Lead Form -->
    <div class="bg-white p-4 rounded shadow-md mb-6">
      <h2 class="text-xl font-semibold mb-4">Capture Lead</h2>
      <div class="grid grid-cols-2 gap-4">
        <input id="customerName" type="text" placeholder="Customer Name" class="p-2 border rounded" />
        <input id="mobileNumber" type="text" placeholder="Mobile Number" class="p-2 border rounded" />
        <input id="address" type="text" placeholder="Address" class="p-2 border rounded" />
        <input id="kwRequirement" type="number" placeholder="KW Requirement" class="p-2 border rounded" />
        <input id="leadBy" type="text" placeholder="Lead By (Referral, Ad, etc)" class="p-2 border rounded" />
        <select id="status" class="p-2 border rounded">
          <option>New</option><option>Contacted</option><option>Visited</option>
          <option>Proposal Sent</option><option>Closed</option><option>Dropped</option>
        </select>
      </div>
      <button id="submit-lead" class="mt-4 bg-green-500 text-white px-4 py-2 rounded">Submit Lead</button>
    </div>

    <!-- Charts -->
    <div class="bg-white p-4 rounded shadow-md mb-6">
      <canvas id="statusChart" class="w-full h-60"></canvas>
    </div>

    <!-- Lead Map -->
    <div id="map" class="h-96 w-full rounded shadow-md"></div>
  </div>

  <!-- Scripts -->
  <script>
    const firebaseConfig = {
  apiKey: "AIzaSyDaFXEXzCXrZwuwpCxPz-5PujHi_nkazRU",
  authDomain: "hca-crm.firebaseapp.com",
  projectId: "hca-crm",
  storageBucket: "hca-crm.firebasestorage.app",
  messagingSenderId: "306976606112",
  appId: "1:306976606112:web:46fc94412fc7c1f91d46c5"
};
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    const USERS_COLLECTION = "users";
    const LEADS_COLLECTION = "leads";

    function login() {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      auth.signInWithEmailAndPassword(email, password)
        .then(() => initDashboard())
        .catch(err => alert("Login error: " + err.message));
    }

    function register() {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      auth.createUserWithEmailAndPassword(email, password)
        .then(user => db.collection(USERS_COLLECTION).doc(user.user.uid).set({ role: "Sales Rep" }))
        .then(() => initDashboard())
        .catch(err => alert("Registration error: " + err.message));
    }

    function logout() {
      auth.signOut().then(() => {
        document.getElementById("dashboard").classList.add("hidden");
        document.getElementById("login-screen").classList.remove("hidden");
      });
    }

    function initDashboard() {
      document.getElementById("login-screen").classList.add("hidden");
      document.getElementById("dashboard").classList.remove("hidden");
      loadSummary();
      loadChart();
      loadMap();
    }

    function submitLead() {
      navigator.geolocation.getCurrentPosition(loc => {
        const lead = {
          customerName: document.getElementById("customerName").value,
          mobileNumber: document.getElementById("mobileNumber").value,
          address: document.getElementById("address").value,
          kwRequirement: parseFloat(document.getElementById("kwRequirement").value),
          leadBy: document.getElementById("leadBy").value,
          status: document.getElementById("status").value,
          leadOwner: auth.currentUser.uid,
          visitDates: [new Date()],
          location: new firebase.firestore.GeoPoint(loc.coords.latitude, loc.coords.longitude),
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        };
        db.collection(LEADS_COLLECTION).add(lead)
          .then(() => alert("Lead saved!"));
      }, () => alert("Location access denied"));
    }

    function loadSummary() {
      db.collection(LEADS_COLLECTION)
        .where("leadOwner", "==", auth.currentUser.uid)
        .get().then(snapshot => {
          const total = snapshot.size;
          const proposals = snapshot.docs.filter(doc => doc.data().status === "Proposal Sent").length;
          document.getElementById("summary-cards").innerHTML = `
            <div class="bg-yellow-100 p-4 rounded"><strong>Total Leads:</strong> ${total}</div>
            <div class="bg-blue-100 p-4 rounded"><strong>Pending Proposals:</strong> ${proposals}</div>
          `;
        });
    }

    function loadChart() {
      db.collection(LEADS_COLLECTION).get().then(snapshot => {
        const counts = {};
        snapshot.forEach(doc => {
          const status = doc.data().status;
          counts[status] = (counts[status] || 0) + 1;
        });
        new Chart(document.getElementById("statusChart"), {
          type: "pie",
          data: {
            labels: Object.keys(counts),
            datasets: [{
              data: Object.values(counts),
              backgroundColor: ["#F59E0B", "#10B981", "#3B82F6", "#EF4444", "#8B5CF6", "#6B7280"]
            }]
          }
        });
      });
    }

      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png").addTo(map);
      db.collection(LEADS_COLLECTION).get().then(snapshot => {
        snapshot
