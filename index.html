<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Solar Leads Tracker</title>

  <!-- Tailwind (for prototyping only) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Firebase -->

  <script src="https://www.gstatic.com/firebasejs/9.6.11/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.11/firebase-firestore-compat.js"></script>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Leaflet.js -->
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
</head>
<body class="bg-gray-100 font-sans">

  <!-- 🔐 Login -->
  <div id="login-screen" class="flex justify-center items-center h-screen">
    <div class="bg-white p-8 rounded shadow-md w-80">
      <h2 class="text-2xl mb-4 font-bold text-center">Login</h2>
      <input id="email" type="email" placeholder="Email" class="w-full mb-2 p-2 border rounded" />
      <input id="password" type="password" placeholder="Password" class="w-full mb-4 p-2 border rounded" />
      <button id="login-btn" class="bg-blue-500 text-white px-4 py-2 rounded w-full">Login</button>
      <p class="text-sm mt-2 text-center">
        No account? <a href="#" id="register-link" class="text-blue-600 underline">Register</a>
      </p>
    </div>
  </div>

  <!-- 📊 Dashboard -->
  <div id="dashboard" class="hidden p-4">
    <div class="flex justify-between items-center mb-4">
      <h1 class="text-3xl font-bold">Dashboard</h1>
      <button id="logout-btn" class="bg-red-500 text-white px-4 py-2 rounded">Logout</button>
    </div>

    <!-- Summary Cards -->
    <div id="summary-cards" class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6"></div>

    <!-- Lead Capture Form -->
    <div class="bg-white p-4 rounded shadow-md mb-6">
      <h2 class="text-xl font-semibold mb-4">Capture Lead</h2>
      <div class="grid grid-cols-2 gap-4">
        <input id="customerName" type="text" placeholder="Customer Name" class="p-2 border rounded" />
        <input id="mobileNumber" type="text" placeholder="Mobile Number" class="p-2 border rounded" />
        <input id="address" type="text" placeholder="Address" class="p-2 border rounded" />
        <input id="kwRequirement" type="number" placeholder="KW Requirement" class="p-2 border rounded" />
        <input id="leadBy" type="text" placeholder="Lead By (Referral, Ad, etc)" class="p-2 border rounded" />
        <select id="status" class="p-2 border rounded">
          <option>New</option><option>Contacted</option><option>Visited</option>
          <option>Proposal Sent</option><option>Closed</option><option>Dropped</option>
        </select>
      </div>
      <button id="submit-lead" class="mt-4 bg-green-500 text-white px-4 py-2 rounded">Submit Lead</button>
    </div>

    <!-- Infographics -->
    <div class="bg-white p-4 rounded shadow-md mb-6">
      <canvas id="statusChart" class="w-full h-60"></canvas>
    </div>

    <!-- Lead Map -->
    <div id="map" class="h-96 w-full rounded shadow-md"></div>
  </div>

  <!-- 🔧 Scripts -->
  <script>
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_AUTH_DOMAIN",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_STORAGE_BUCKET",
      messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    const USERS_COLLECTION = "users";
    const LEADS_COLLECTION = "leads";

    // LOGIN
    function login() {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      auth.signInWithEmailAndPassword(email, password)
        .then(() => initDashboard())
        .catch(err => alert("Login error: " + err.message));
    }

    // REGISTER
    function register() {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      auth.createUserWithEmailAndPassword(email, password)
        .then(user => db.collection(USERS_COLLECTION).doc(user.user.uid).set({ role: "Sales Rep" }))
        .then(() => initDashboard())
        .catch(err => alert("Registration error: " + err.message));
    }

    // LOGOUT
    function logout() {
      auth.signOut().then(() => {
        document.getElementById("dashboard").classList.add("hidden");
        document.getElementById("login-screen").classList.remove("hidden");
      });
    }

      document.getElementById("login-screen").classList.add("hidden");
      document.getElementById("dashboard").classList.remove("hidden");
      loadSummary();
      loadChart();
      loadMap();
    }
