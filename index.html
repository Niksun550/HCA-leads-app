<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Solar Sales CRM</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Firebase UMD SDKs (compat version) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <!-- Google Maps API -->
  <script src="https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY&callback=initMap" async defer></script>
  <style>
    #map {
      width: 100%;
      height: 400px;
      border-radius: 0.5rem;
      margin-top: 1rem;
    }
  </style>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDaFXEXzCXrZwuwpCxPz-5PujHi_nkazRU",
      authDomain: "hca-crm.firebaseapp.com",
      projectId: "hca-crm",
      storageBucket: "hca-crm.firebasestorage.app",
      messagingSenderId: "306976606112",
      appId: "1:306976606112:web:46fc94412fc7c1f91d46c5"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    let map;
    function initMap() {
      map = new google.maps.Map(document.getElementById("map"), {
        center: { lat: 19.0760, lng: 72.8777 }, // Mumbai default
        zoom: 8,
      });
    }
  </script>
</head>
<body class="bg-gray-100 text-gray-800">
  <div id="auth-section" class="min-h-screen flex items-center justify-center">
    <div class="bg-white p-6 rounded shadow w-full max-w-md">
      <h2 class="text-2xl font-bold mb-4">Login</h2>
      <input type="email" id="email" placeholder="Email" class="w-full border p-2 mb-2 rounded" />
      <input type="password" id="password" placeholder="Password" class="w-full border p-2 mb-4 rounded" />
      <button onclick="login()" class="bg-blue-600 text-white px-4 py-2 rounded w-full">Login</button>
    </div>
  </div>

  <div id="dashboard-section" class="hidden p-4">
    <div class="flex justify-between items-center mb-4">
      <h1 class="text-2xl font-bold">Solar Sales Dashboard</h1>
      <button onclick="logout()" class="bg-red-600 text-white px-4 py-2 rounded">Logout</button>
    </div>

    <div class="bg-white p-4 rounded shadow mb-6">
      <h2 class="text-xl font-semibold mb-2">Add New Lead</h2>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <input id="customerName" placeholder="Customer Name" class="border p-2 rounded" />
        <input id="mobile" placeholder="Mobile Number" class="border p-2 rounded" />
        <input id="address" placeholder="Address" class="border p-2 rounded" />
        <input id="kw" type="number" placeholder="KW Requirement" class="border p-2 rounded" />
        <select id="status" class="border p-2 rounded">
          <option>New</option>
          <option>Contacted</option>
          <option>Visited</option>
          <option>Proposal Sent</option>
          <option>Closed</option>
          <option>Dropped</option>
        </select>
        <input id="leadBy" placeholder="Lead By (Referral, Ad...)" class="border p-2 rounded" />
      </div>
      <button onclick="addLead()" class="mt-4 bg-green-600 text-white px-4 py-2 rounded">Save Lead</button>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
      <canvas id="statusChart"></canvas>
      <canvas id="kwChart"></canvas>
    </div>

    <div class="bg-white p-4 rounded shadow mb-6">
      <h2 class="text-xl font-semibold mb-4">Leads</h2>
      <table class="w-full table-auto text-sm">
        <thead>
          <tr class="bg-gray-200">
            <th class="p-2">Name</th>
            <th class="p-2">Mobile</th>
            <th class="p-2">KW</th>
            <th class="p-2">Status</th>
            <th class="p-2">Lead By</th>
            <th class="p-2">Visit Date</th>
          </tr>
        </thead>
        <tbody id="leadTable"></tbody>
      </table>
    </div>

    <div id="map"></div>
  </div>

  <script>
    function login() {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      auth.signInWithEmailAndPassword(email, password)
        .then(() => {
          document.getElementById("auth-section").classList.add("hidden");
          document.getElementById("dashboard-section").classList.remove("hidden");
          if (typeof initMap === "function") initMap();
          loadLeads();
        })
        .catch(err => alert("Login failed: " + err.message));
    }

    function logout() {
      auth.signOut().then(() => location.reload());
    }

    function addLead() {
      navigator.geolocation.getCurrentPosition((pos) => {
        db.collection("leads").add({
          customerName: document.getElementById("customerName").value,
          mobile: document.getElementById("mobile").value,
          address: document.getElementById("address").value,
          kw: parseFloat(document.getElementById("kw").value),
          status: document.getElementById("status").value,
          leadBy: document.getElementById("leadBy").value,
          visitDates: [new Date().toISOString()],
          owner: auth.currentUser?.email || "unknown",
          location: {
            lat: pos.coords.latitude,
            lng: pos.coords.longitude
          },
          createdAt: new Date()
        });
      }, err => alert("Location access denied: " + err.message));
    }

    function loadLeads() {
      db.collection("leads").onSnapshot(snapshot => {
        const table = document.getElementById("leadTable");
        table.innerHTML = "";
        const statusCounts = {};
        let totalKW = 0;

        snapshot.forEach(doc => {
          const data = doc.data();
          if (map && data.location) {
            new google.maps.Marker({
              position: data.location,
              map,
              title: data.customerName
            });
          }

          const row = `<tr>
            <td class="p-2">${data.customerName}</td>
            <td class="p-2">${data.mobile}</td>
            <td class="p-2">${data.kw}</td>
            <td class="p-2">${data.status}</td>
            <td class="p-2">${data.leadBy}</td>
            <td class="p-2">${new Date(data.visitDates?.[0]).toLocaleDateString()}</td>
          </tr>`;
          table.innerHTML += row;

          statusCounts[data.status] = (statusCounts[data.status] || 0) + 1;
          totalKW += data.kw;
        });

        renderCharts(statusCounts, totalKW);
      });
    }

    function renderCharts(statusCounts, totalKW) {
      const statusCtx = document.getElementById('statusChart').getContext('2d');
      new Chart(statusCtx, {
        type: 'pie',
        data: {
          labels: Object.keys(statusCounts),
          datasets: [{
            data: Object.values(statusCounts),
            backgroundColor: ['#3b82f6', '#10b981', '#facc15', '#f87171', '#6366f1', '#6b7280']
          }]
        }
      });

      const kwCtx = document.getElementById('kwChart').getContext('2d');
      new Chart(kwCtx, {
        type: 'bar',
        data: {
          labels: ['Total KW'],
          datasets: [{
            label: 'KW Required',
            data: [totalKW],
            backgroundColor: '#34d399'
          }]
        }
      });
    }
  </script>
</body>
</html>
