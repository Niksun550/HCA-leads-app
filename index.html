<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solar Sales Dashboard</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        #map {
            height: 300px;
            width: 100%;
        }
    </style>
</head>

<body class="bg-gray-100 text-gray-900">
    <div class="max-w-4xl mx-auto p-4">
        <h1 class="text-2xl font-bold mb-4">Solar Sales Client Form</h1>
        <form id="clientForm" class="grid grid-cols-1 gap-4 bg-white p-4 rounded shadow">
            <input type="text" id="clientName" placeholder="Client Name" class="border p-2 rounded" required>
            <input type="text" id="mobileNumber" placeholder="Mobile Number" class="border p-2 rounded" required>
            <input type="text" id="location" placeholder="Location" class="border p-2 rounded">
            <input type="text" id="leadBy" placeholder="Lead By" class="border p-2 rounded">
            <input type="text" id="leadOwner" placeholder="Lead Owner" class="border p-2 rounded">
            <input type="text" id="systemKW" placeholder="System KW Requirement" class="border p-2 rounded">
            <textarea id="remarks" placeholder="Remarks" class="border p-2 rounded"></textarea>
            <select id="status" class="border p-2 rounded">
                <option value="New">New</option>
                <option value="Visited">Visited</option>
                <option value="Quoted">Quoted</option>
                <option value="Closed">Closed</option>
            </select>
            <div id="map"></div>
            <button type="submit" class="bg-blue-500 text-white py-2 rounded hover:bg-blue-600">Save</button>
        </form>

        <div class="mt-6">
            <h2 class="text-xl font-semibold mb-2">Leads Dashboard</h2>
            <div id="dashboard" class="grid gap-4"></div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
  apiKey: "AIzaSyDaFXEXzCXrZwuwpCxPz-5PujHi_nkazRU",
  authDomain: "hca-crm.firebaseapp.com",
  projectId: "hca-crm",
  storageBucket: "hca-crm.firebasestorage.app",
  messagingSenderId: "306976606112",
  appId: "1:306976606112:web:46fc94412fc7c1f91d46c5"
};

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        document.getElementById("clientForm").addEventListener("submit", async function (e) {
            e.preventDefault();
            const data = {
                clientName: document.getElementById("clientName").value,
                mobileNumber: document.getElementById("mobileNumber").value,
                location: document.getElementById("location").value,
                leadBy: document.getElementById("leadBy").value,
                leadOwner: document.getElementById("leadOwner").value,
                systemKW: document.getElementById("systemKW").value,
                remarks: document.getElementById("remarks").value,
                status: document.getElementById("status").value,
                timestamp: new Date()
            };
            await db.collection("clients").add(data);
            alert("Client information saved.");
            this.reset();
            loadDashboard();
        });

        async function loadDashboard() {
            const dashboard = document.getElementById("dashboard");
            dashboard.innerHTML = "";
            const snapshot = await db.collection("clients").get();
            snapshot.forEach(doc => {
                const d = doc.data();
                dashboard.innerHTML += `
                    <div class="bg-white p-4 rounded shadow">
                        <p><strong>Name:</strong> ${d.clientName}</p>
                        <p><strong>Mobile:</strong> ${d.mobileNumber}</p>
                        <p><strong>Status:</strong> ${d.status}</p>
                        <p><strong>Lead By:</strong> ${d.leadBy}</p>
                        <p><strong>KW:</strong> ${d.systemKW}</p>
                        <p><strong>Remarks:</strong> ${d.remarks}</p>
                    </div>
                `;
            });
        }

        let map;
        function initMap() {
            map = new google.maps.Map(document.getElementById("map"), {
                center: { lat: 20.5937, lng: 78.9629 },
                zoom: 5,
            });

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition((position) => {
                    const pos = {
                        lat: position.coords.latitude,
                        lng: position.coords.longitude,
                    };
                    map.setCenter(pos);
                    new google.maps.Marker({
                        position: pos,
                        map: map,
                    });
                });
            }
        }

        window.onload = function () {
            loadDashboard();
        };
    </script>
    <script async defer
        src="https://maps.googleapis.com/maps/api/js?key=YOUR_GOOGLE_MAPS_API_KEY&callback=initMap">
    </script>
</body>

</html>
